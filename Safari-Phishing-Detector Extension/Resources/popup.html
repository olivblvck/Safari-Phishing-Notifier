<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Check</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <h1>Bezpieczeństwo strony</h1>
    <button id="open-settings" class="icon-button" type="button" aria-label="Ustawienia" title="Ustawienia">⚙︎</button>
  </header>
  <main id="result" class="hidden">
    <div class="status-summary" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="statusBadge" class="status-badge"></span>
    </div>
    <section id="warningBox" class="warning"><strong>Sprawdzanie strony…</strong></section>
    <section class="score" aria-label="Ocena ryzyka">
      <div class="score-labels"><span class="score-label">Risk Score</span><span id="scoreNumber" class="score-number">0/100</span></div>
      <div class="score-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="scoreFill" class="score-fill"></div></div>
    </section>
    <section id="details" class="details">
      <div id="analysis-container" class="analysis-container">
        <button id="toggle-details" class="details-toggle" type="button">Pokaż szczegóły analizy</button>
        <ul id="analysis-details" class="analysis-details"></ul>
      </div>
    </section>
    <div id="buttons" class="buttons"></div>
  </main>
  <div id="error" class="hidden" role="alert"><div class="warning red"><strong>Błąd</strong> <span id="errorMessage"></span></div></div>
  <script src="i18n-helper.js"></script>
  <script src="popup-placeholder-fix.js"></script>
  <script src="config.js"></script>
  <script src="risk-engine.js"></script>
  <script src="security-checker.js"></script>
  <script src="popup.js"></script>
</body>
</html>
